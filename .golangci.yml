run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - misspell
    - revive
    - gocritic
    - errorlint
    - bodyclose
    - unconvert

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true  # thin re-exports (String, Int, ...) are documented as a block

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, bodyclose, gocritic]
