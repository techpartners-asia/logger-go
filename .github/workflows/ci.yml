name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          GOWORK: off
      - run: go test -run '^$' -bench . -benchmem ./...
        env:
          GOWORK: off

  adapters:
    name: adapter ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [fiber, gin, grpc, otel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: adapters/${{ matrix.module }}/go.sum
      - run: go vet ./... && go test -race -count=1 ./...
        working-directory: adapters/${{ matrix.module }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
